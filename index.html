<style>
:root{color-scheme:light;--bg:#fff;--side:#f7f8fa;--line:#e7e9ed;--ink:#202124;--muted:#747a84;--soft:#f1f3f5;--accent:#4d6bfe;font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink)}button,textarea,input{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:2px solid #92a2ff;outline-offset:2px}
.app{height:100dvh;min-height:500px;display:grid;grid-template-columns:232px minmax(0,1fr)}.rail{background:var(--side);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:10px;padding:0 7px}.brand-mark{width:31px;height:31px;border-radius:10px;background:#202124;color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:-1px}.brand-name{font-size:15px;font-weight:650}.brand-sub{font-size:11px;color:var(--muted)}.new-chat{height:40px;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid #dfe2e8;background:#fff;border-radius:9px;color:#252830;font-size:14px}.new-chat:hover{background:#f0f2f5}.rail-note{margin-top:auto;color:#8b9099;font-size:11px;line-height:1.6;padding:8px 7px}.rail-status{display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;border-radius:50%;background:#42a978}.main{min-width:0;display:flex;flex-direction:column;position:relative}.topbar{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,3vw,36px);flex:none}.model-select{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:550}.model-label{font-size:12px;color:var(--muted);font-weight:400}.top-actions{display:flex;align-items:center;gap:8px}.plain{border:0;background:transparent;border-radius:8px;color:#4d535c;padding:8px 10px;font-size:13px}.plain:hover{background:var(--soft)}.chat{width:min(100%,820px);margin:0 auto;padding:30px 24px 190px;flex:1;overflow-y:auto;scroll-behavior:smooth}.welcome{min-height:min(55vh,500px);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:28px 0}.welcome-mark{width:50px;height:50px;border:1px solid #e5e7eb;border-radius:16px;display:grid;place-items:center;font-weight:750;color:#383d46;margin-bottom:20px}.welcome h1{font-size:25px;line-height:1.3;font-weight:620;margin:0 0 10px;letter-spacing:-.4px}.welcome p{margin:0;color:var(--muted);font-size:14px}.suggestions{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:28px;max-width:680px}.suggestion{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;font-size:13px;color:#4c5159}.suggestion:hover{background:#f7f8fa;border-color:#d5d8de}.turn{margin:0 0 28px}.user-turn{display:flex;justify-content:flex-end}.user-bubble{max-width:82%;background:#f3f4f6;border-radius:18px;padding:10px 15px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}.assistant-turn{padding:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.75}.assistant-head{display:flex;align-items:center;gap:8px;color:#5d626c;font-size:12px;margin:0 0 8px}.assistant-mini{width:19px;height:19px;border:1px solid #e4e6ea;border-radius:6px;display:grid;place-items:center;font-size:9px;font-weight:750;color:#343a44}.tool-tag{border-left:2px solid #dbe0ff;padding-left:8px;color:#7a8190;font-size:11px}.typing{color:var(--muted);font-size:14px;padding:12px 0}.composer-area{position:absolute;z-index:2;bottom:0;left:0;right:0;padding:22px 18px 14px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 22%)}.composer{width:min(100%,770px);margin:0 auto;border:1px solid #dcdfe5;border-radius:17px;background:#fff;box-shadow:0 5px 22px #2021240c;padding:10px 11px 9px;transition:border .15s,box-shadow .15s}.composer:focus-within{border-color:#c6cbd5;box-shadow:0 5px 24px #20212412}.message{width:100%;min-height:44px;max-height:180px;resize:none;border:0;outline:0!important;background:transparent;padding:5px 8px;color:var(--ink);font-size:15px;line-height:1.55}.message::placeholder{color:#9a9fa8}.compose-row{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 0}.compose-left,.compose-right{display:flex;align-items:center;gap:7px}.attach{width:34px;height:34px;border:0;background:transparent;color:#68707c;border-radius:10px;display:grid;place-items:center;font-size:20px}.attach:hover{background:var(--soft)}.local-file{font-size:11px;color:#6d7380;max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.clear-file{border:0;background:transparent;color:#8b9099;padding:4px}.hint{font-size:11px;color:#969ba4}.send{width:34px;height:34px;border:0;border-radius:11px;background:#252830;color:white;display:grid;place-items:center;font-size:15px}.send:hover{background:#111318}.send:disabled{background:#c6c8cc;cursor:wait}.fineprint{width:min(100%,770px);margin:7px auto 0;text-align:center;font-size:10px;color:#969ba4}.file-input{display:none}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.settings{width:min(92vw,420px);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 16px 50px #10182824;color:var(--ink)}.settings::backdrop{background:#20212466}.settings h2{margin:0 0 18px;font-size:19px}.settings label{display:block;margin:12px 0 6px;font-size:13px;color:#555b65}.settings select,.settings input{width:100%;height:42px;border:1px solid #d9dce2;border-radius:9px;background:#fff;padding:0 11px;color:var(--ink)}.settings p{min-height:40px;margin:12px 0 4px;color:var(--muted);font-size:12px}.settings-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.save-settings{border:0;border-radius:8px;background:#252830;color:#fff;padding:8px 16px;font-size:13px}
@media(max-width:700px){.app{grid-template-columns:1fr}.rail{display:none}.topbar{height:52px;padding:0 14px}.chat{padding:22px 16px 172px}.welcome{min-height:49vh}.welcome h1{font-size:23px}.composer-area{padding:18px 10px 10px}.composer{border-radius:15px}.hint{display:none}.user-bubble{max-width:92%}.model-label{display:none}}
</style>
</head>
<body>
<div class="app">
 <aside class="rail" aria-label="工作模型信息">
  <div class="brand"><div class="brand-mark">W3</div><div><div class="brand-name">WSRN</div><div class="brand-sub">工作语言模型</div></div></div>
  <button class="new-chat" id="newChat" type="button"><span aria-hidden="true">＋</span> 新对话</button>
  <div class="rail-note"><div class="rail-status"><i class="dot"></i>自动工作工具</div><br>架空 2002 技术路线<br>小型 LSTM + 自动路由</div>
 </aside>
 <main class="main">
  <header class="topbar"><div class="model-select">WSRN-3 <span class="model-label">工作模型 · 2002 技术路线</span></div><div class="top-actions"><button class="plain" id="connection" type="button">连接设置</button><button class="plain" id="clearChat" type="button" aria-label="新建对话">新对话</button></div></header>
  <dialog class="settings" id="settings"><form method="dialog" id="settingsForm"><h2>模型连接</h2><label for="connectionMode">服务位置</label><select id="connectionMode"><option value="current">当前服务</option><option value="local">本机服务</option><option value="custom">自定义 API</option></select><label for="apiAddress" id="apiAddressLabel">API 地址</label><input id="apiAddress" type="url" placeholder="https://example.com/api/chat" autocomplete="url"><p id="connectionHelp">本机模式需要在运行 WSRN 服务的电脑上打开本地页面。</p><div class="settings-actions"><button class="plain" id="cancelSettings" type="button">取消</button><button class="save-settings" id="saveSettings" type="submit">保存</button></div></form></dialog>
  <section class="chat" id="chatlog" aria-live="polite">
   <div class="welcome" id="welcome"><div class="welcome-mark">W3</div><h1>今天要处理什么？</h1><p>直接说任务，我会自动调用合适的工作工具。</p><div class="suggestions"><button class="suggestion" data-prompt="请帮我算一下 1280 + 460">计算一笔账</button><button class="suggestion" data-prompt="帮我写一封邮件，主题：项目进度，告知团队初稿已完成">起草工作邮件</button><button class="suggestion" data-prompt="给客户报价：数量 10 件，单价 25 元，税率 13%">生成报价</button><button class="suggestion" data-prompt="总结我附上的文档">总结文档</button></div></div>
  </section>
  <div class="composer-area"><form class="composer" id="chatform"><label class="sr" for="message">发送消息给 WSRN</label><textarea id="message" class="message" maxlength="2000" rows="1" placeholder="给 WSRN 发送消息" required></textarea><div class="compose-row"><div class="compose-left"><button class="attach" id="attach" type="button" aria-label="添加 TXT 或 CSV 文件" title="添加 TXT 或 CSV 文件">＋</button><input class="file-input" id="file" type="file" accept=".txt,.csv,text/plain,text/csv"><span class="local-file" id="fileName" hidden></span><button class="clear-file" id="clearFile" type="button" aria-label="移除附件" hidden>×</button></div><div class="compose-right"><span class="hint">Enter 发送 · Shift+Enter 换行</span><button class="send" id="send" type="submit" aria-label="发送">↑</button></div></div></form><div class="fineprint">工作工具会按任务自动调用 · TXT/CSV 附件仅在此浏览器处理 · 聊天请求发送至 WSRN 服务</div></div>
 </main>
</div>
<script>
const DEFAULT_API_BASE='https://wsrn-work-model.xdd44894.chatgpt.site';
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const log=$('#chatlog'),form=$('#chatform'),input=$('#message'),send=$('#send'),welcome=$('#welcome'),fileInput=$('#file'),fileName=$('#fileName'),clearFile=$('#clearFile');
let localDoc=null,conversation=[];
function apiEndpoint(){let base=DEFAULT_API_BASE;try{base=localStorage.getItem('wsrn_api_base')??base}catch{}if(!base)return '/api/chat';base=base.replace(/\/+$/,'');return base.endsWith('/api/chat')?base:base+'/api/chat'}
const toolLabels={calculator:'计算器',quote:'报价工具','office-email':'邮件草稿','office-report':'报告草稿',proofread:'文字校对',translator:'短句翻译','knowledge-search':'知识检索','code-helper':'编程辅助','learning-coach':'学习辅助','local-search':'本机资料检索','local-summary':'本机文档摘要','local-csv':'本机表格计算','local-stats':'本机文档统计'};
function scrollBottom(){log.scrollTop=log.scrollHeight}
function addUser(text){welcome?.remove();conversation.push({role:'user',content:text});conversation=conversation.slice(-12);const row=document.createElement('div');row.className='turn user-turn';const bubble=document.createElement('div');bubble.className='user-bubble';bubble.textContent=text;row.appendChild(bubble);log.appendChild(row);scrollBottom()}
function addAssistant(text,tool){conversation.push({role:'assistant',content:text});conversation=conversation.slice(-12);const row=document.createElement('div');row.className='turn assistant-turn';const head=document.createElement('div');head.className='assistant-head';const mini=document.createElement('span');mini.className='assistant-mini';mini.textContent='W3';const name=document.createElement('span');name.textContent='WSRN';head.append(mini,name);if(tool){const tag=document.createElement('span');tag.className='tool-tag';tag.textContent='自动调用 · '+(toolLabels[tool]||tool);head.append(tag)}const body=document.createElement('div');body.textContent=text;row.append(head,body);log.appendChild(row);scrollBottom()}
function typing(on){let el=$('#typing');if(on&&!el){el=document.createElement('div');el.id='typing';el.className='typing';el.textContent='正在处理…';log.append(el);scrollBottom()}else if(!on)el?.remove()}
function parseCsvLine(line){const cells=[];let cell='',quoted=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'&&quoted&&line[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=!quoted;else if(c===','&&!quoted){cells.push(cell);cell=''}else cell+=c}cells.push(cell);return cells}
function sentenceSummary(text,query=''){const sentences=(text.match(/[^。！？.!?\n]+[。！？.!?]?/g)||[]).map(x=>x.trim()).filter(Boolean);if(!sentences.length)return '文件没有可提取的正文。';const runs=query.toLowerCase().match(/[\u3400-\u9fff]+|[a-z0-9]{3,}/g)||[],terms=[];runs.forEach(run=>{if(/^[\u3400-\u9fff]+$/.test(run)){for(let i=0;i<run.length-1;i++)terms.push(run.slice(i,i+2))}else terms.push(run)});const ranked=sentences.map((s,i)=>({s,i,score:terms.reduce((n,t)=>n+(s.toLowerCase().includes(t)?2:0),0)+(i===0?1:0)})).sort((a,b)=>b.score-a.score||a.i-b.i).slice(0,8).sort((a,b)=>a.i-b.i);return ranked.map(x=>'• '+x.s).join('\n')}
function localQuoteTool(message){if(!localDoc||!/\.csv$/i.test(localDoc.name)||!/报价|报个价|报一下价格/.test(message))return null;const rows=localDoc.text.split(/\r?\n/).filter(Boolean).map(parseCsvLine);if(rows.length<2)return {tool:'quote',reply:'这份 CSV 没有可用的商品数据行。'};const headers=rows[0].map(x=>x.trim().toLowerCase()),nameCol=headers.findIndex(x=>/产品|商品|项目|名称|品名|product|item|name/.test(x)),priceCol=headers.findIndex(x=>/单价|价格|售价|price|cost/.test(x));if(nameCol<0||priceCol<0)return {tool:'quote',reply:'我读到了附件，但没认出商品名和单价列。请使用“产品/商品”和“单价/价格”列名。'};const products=rows.slice(1).map(r=>({name:(r[nameCol]||'').trim(),price:Number((r[priceCol]||'').replace(/[￥¥$,]/g,'').trim())})).filter(x=>x.name&&Number.isFinite(x.price));const named=(message.match(/(?:产品|商品|项目|品名)[:：\s]*([^，,。\s]+)/)||[])[1];let product=named?products.find(x=>x.name===named||x.name.includes(named)):products.find(x=>message.includes(x.name));if(!product&&products.length===1)product=products[0];if(!product)return {tool:'quote',reply:products.length?'请告诉我这份价目表里的商品名称，例如：产品：'+products.slice(0,5).map(x=>x.name).join('、')+'。':'附件中没有可用的商品价格。'};const qm=message.match(/(?:数量|订购|购买|需要)\s*(\d+(?:\.\d+)?)/)||message.match(/(\d+(?:\.\d+)?)\s*(?:件|个|台|套|箱|份)/),tm=message.match(/(?:税率|税)\s*(\d+(?:\.\d+)?)\s*%?/),cm=message.match(/(?:客户(?:名称)?|发给|给(?!客户))[:：\s]*([\u3400-\u9fffA-Za-z0-9·_-]{1,20})/);const qty=qm?Number(qm[1]):0,tax=tm?Number(tm[1]):0,client=cm?cm[1].replace(/(?:报价|报个价)$/,''):'客户';if(!(qty>0))return {tool:'quote',reply:'我从附件价目表中找到 '+product.name+'，单价 '+product.price.toFixed(2)+' 元。请告诉我报价数量。'};const subtotal=Math.round(qty*product.price*100)/100,vat=Math.round(subtotal*tax)/100,total=subtotal+vat;return {tool:'quote',reply:'报价草稿\n客户：'+client+'\n项目：'+product.name+'\n数量：'+qty+'\n单价：'+product.price.toFixed(2)+' 元\n小计：'+subtotal.toFixed(2)+' 元\n税率：'+tax+'%\n税额：'+vat.toFixed(2)+' 元\n报价总额：'+total.toFixed(2)+' 元'}}
function localTool(message){if(!localDoc)return null;const q=message.trim(),explicit=/(总结|摘要|概括|总结一下|查找|搜索|检索|找出|统计|行数|字数|字符数|CSV|表格|加总|求和|合计|销售额)/i.test(q),question=/[？?]|如何|哪些|什么|什么时候|谁负责|多少|能否|是否|有没有/.test(q);if(!explicit&&!question)return null;const text=localDoc.text,name=localDoc.name;
 if(/(?:求和|加总|合计|销售额)/.test(q)&&/\.csv$/i.test(name)){const colMatch=q.match(/第\s*(\d+)\s*列/),col=colMatch?Number(colMatch[1]):1;let sum=0,count=0;text.split(/\r?\n/).forEach((line,i)=>{if(i===0&&/列名|名称|销售|金额|价格/.test(line))return;const cell=(parseCsvLine(line)[col-1]||'').trim().replace(/^[¥￥$]/,'');if(/^-?(?:\d+\.?\d*|\.\d+)$/.test(cell)){sum+=Number(cell);count++}});return {tool:'local-csv',reply:'已读取 '+name+'，第 '+col+' 列识别到 '+count+' 个数字。\n合计：'+sum.toFixed(2)}}
 if(/(?:统计|行数|字数|字符数)/.test(q)){return {tool:'local-stats',reply:'文档：'+name+'\n行数：'+text.split(/\r?\n/).length+'\n字符数：'+Array.from(text).length+'\nUTF-8 字节：'+new TextEncoder().encode(text).length}}
 if(/(?:查找|搜索|检索|找出)/.test(q)&&!/(总结|摘要|概括)/.test(q)){const terms=q.replace(/(?:请|帮我|在文档中|在文件中|查找|搜索|检索|找出|关键词|包含|的内容)/g,' ').trim().split(/\s+/).filter(x=>x.length>1);const lines=text.split(/\r?\n/),hits=[];lines.forEach((line,i)=>{if(terms.some(t=>line.toLowerCase().includes(t.toLowerCase()))&&hits.length<12)hits.push((i+1)+': '+line)});return {tool:'local-search',reply:hits.length?'在 '+name+' 中找到：\n'+hits.join('\n'):'在 '+name+' 中没有找到匹配内容。'}}
 if(question&&!explicit){const relevant=sentenceSummary(text,q).replace(/^• /gm,'');return {tool:'local-search',reply:relevant==='文件没有可提取的正文。'?'附件没有可用正文。':'根据 '+name+' 找到的相关内容：\n'+relevant+'\n\n以上摘自附件，请以原文为准。'}}
 return {tool:'local-summary',reply:'文档摘要（从原文抽取重点句）：\n'+sentenceSummary(text,q)}
}
function wantsDocument(message){return /(?:总结|摘要|概括|查找|搜索|检索|找出|统计|行数|字数|字符数|CSV|表格|加总|求和|合计|销售额)/i.test(message)}
async function ask(text){addUser(text);send.disabled=true;typing(true);try{const quote=localQuoteTool(text);if(quote){typing(false);addAssistant(quote.reply,quote.tool);return}const local=localTool(text);if(local){typing(false);addAssistant(local.reply,local.tool);return}if(!localDoc&&wantsDocument(text)){typing(false);addAssistant('先点输入框左侧的“＋”添加 TXT 或 CSV 文件，我会在浏览器里自动检索或处理它。','local-search');return}const r=await fetch(apiEndpoint(),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:text,history:conversation.slice(-8)})});let data;try{data=await r.json()}catch{throw new Error('模型服务返回了无效响应。')}if(!r.ok)throw new Error(data.error||'请求失败');typing(false);addAssistant(data.reply,data.tool)}catch(e){typing(false);addAssistant(e.message||'暂时无法连接模型服务。')}finally{typing(false);send.disabled=false;input.focus()}}
form.addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(!text)return;input.value='';input.style.height='auto';ask(text)});
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,180)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
$$('[data-prompt]').forEach(b=>b.addEventListener('click',()=>{input.value=b.dataset.prompt;input.focus();input.dispatchEvent(new Event('input'))}));
function resetChat(){conversation=[];log.replaceChildren();const div=document.createElement('div');div.className='welcome';div.id='welcome';div.innerHTML='<div class="welcome-mark">W3</div><h1>今天要处理什么？</h1><p>直接说任务，我会自动调用合适的工作工具。</p><div class="suggestions"><button class="suggestion" data-prompt="请帮我算一下 1280 + 460">计算一笔账</button><button class="suggestion" data-prompt="帮我写一封邮件，主题：项目进度，告知团队初稿已完成">起草工作邮件</button><button class="suggestion" data-prompt="给客户报价：数量 10 件，单价 25 元，税率 13%">生成报价</button><button class="suggestion" data-prompt="总结我附上的文档">总结文档</button></div>';log.append(div);$$('[data-prompt]').forEach(b=>b.addEventListener('click',()=>{input.value=b.dataset.prompt;input.focus();input.dispatchEvent(new Event('input'))}));input.focus()}
$('#newChat').addEventListener('click',resetChat);$('#clearChat').addEventListener('click',resetChat);
$('#attach').addEventListener('click',()=>fileInput.click());fileInput.addEventListener('change',async()=>{const f=fileInput.files&&fileInput.files[0];if(!f)return;if(f.size>2*1024*1024){addAssistant('这个文件超过 2 MB。请使用较小的 TXT 或 CSV 文件。');fileInput.value='';return}localDoc={name:f.name,text:await f.text()};fileName.textContent='仅本机 · '+f.name;fileName.hidden=false;clearFile.hidden=false;input.focus()});clearFile.addEventListener('click',()=>{localDoc=null;fileInput.value='';fileName.hidden=true;clearFile.hidden=true});
const settings=$('#settings'),mode=$('#connectionMode'),apiAddress=$('#apiAddress'),apiAddressLabel=$('#apiAddressLabel'),connectionHelp=$('#connectionHelp');
function updateConnectionForm(){const current=mode.value==='current',local=mode.value==='local';apiAddress.hidden=current;apiAddressLabel.hidden=current;apiAddress.disabled=local;if(local)apiAddress.value='http://127.0.0.1:8080/api/chat';else if(current)apiAddress.value='';connectionHelp.textContent=current?'使用这个页面默认连接的 WSRN 服务。':local?'本机模式需要在运行 WSRN 服务的电脑上打开 http://127.0.0.1:8080；远程网页可能无法直接连接本机 HTTP 服务。':'填写兼容 WSRN 的完整 API 地址，例如 https://example.com/api/chat。'}
$('#connection').addEventListener('click',()=>{let saved='';try{saved=localStorage.getItem('wsrn_api_base')||''}catch{}mode.value=!saved?'current':saved.startsWith('http://127.0.0.1:8080')?'local':'custom';apiAddress.value=saved;updateConnectionForm();settings.showModal()});mode.addEventListener('change',updateConnectionForm);$('#cancelSettings').addEventListener('click',()=>settings.close());$('#settingsForm').addEventListener('submit',e=>{e.preventDefault();try{if(mode.value==='current')localStorage.removeItem('wsrn_api_base');else if(mode.value==='local')localStorage.setItem('wsrn_api_base','http://127.0.0.1:8080/api/chat');else{const value=apiAddress.value.trim();const parsed=new URL(value);if(!['http:','https:'].includes(parsed.protocol))throw new Error('');localStorage.setItem('wsrn_api_base',value)}}catch{connectionHelp.textContent='地址无效，或浏览器未允许保存连接设置。';return}settings.close();addAssistant('已更新模型服务连接设置。')});
updateConnectionForm();
</script>
</body>
</html>
